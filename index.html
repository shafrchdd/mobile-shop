<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#087f5b">
  <meta name="description" content="Mobile-first, offline-ready Kerala mobile shop management">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./css/style.css">
  <script defer src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.js"></script>
  <title>Mobile Shop ERP</title>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="./" aria-label="Mobile Shop ERP home">
        <span class="brand-mark"><i data-lucide="smartphone"></i></span>
        <span><b>Mobile Shop</b><small>Shop management</small></span>
      </a>
      <div class="nav-caption">WORKSPACE</div>
      <nav id="sideNav" class="side-nav"></nav>
      <div class="sidebar-bottom">
        <div class="offline-status"><span class="status-dot"></span><span><b>Ready to work</b><small>Data saved on this device</small></span></div>
        <button class="sidebar-link" data-page="settings"><i data-lucide="settings-2"></i><span>Settings & backup</span></button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-left">
          <div class="mobile-brand"><span class="brand-mark"><i data-lucide="smartphone"></i></span></div>
          <div><div class="eyebrow" id="todayLabel"></div><h1 id="pageTitle">Overview</h1></div>
        </div>
        <div class="top-actions">
          <span class="online-indicator"><span class="status-dot"></span><span>Offline ready</span></span>
          <button class="icon-btn" id="themeBtn" type="button" aria-label="Toggle theme"><i data-lucide="moon-star"></i></button>
          <button class="profile-btn" type="button" aria-label="Shop profile">S</button>
        </div>
      </header>
      <section id="view" aria-live="polite"></section>
    </main>
  </div>

  <nav class="mobile-nav" id="mobileNav" aria-label="Main navigation"></nav>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <dialog id="modal" class="app-modal">
    <form id="modalForm" autocomplete="off">
      <div class="modal-head"><div><div class="modal-kicker" id="modalKicker">DETAILS</div><h2 id="modalTitle"></h2></div><button class="icon-btn" type="button" id="modalClose" aria-label="Close"><i data-lucide="x"></i></button></div>
      <div id="modalBody" class="modal-body"></div>
      <div class="modal-actions"><button class="btn btn-quiet" type="button" id="modalCancel">Cancel</button><button class="btn btn-primary" type="button" id="modalSave">Save</button></div>
    </form>
  </dialog>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
