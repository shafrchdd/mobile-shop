<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#087f5b"><meta name="description" content="Offline-first Kerala Mobile Shop ERP">
<link rel="manifest" href="./manifest.json"><link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./css/style.css">
<title>Mobile Shop ERP</title>
</head>
<body>
